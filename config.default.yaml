# mysandbox 默认配置（随包发布）。
# 用户覆盖：~/.config/mysandbox/config.yaml（首启自动生成，含随机 token，权限 0600）。
# 这里留空的字段（sshSource）首启按宿主用户自动填充。
#
# ⚠️ 安全：mysandbox 跑 unprivileged LXC 容器（容器 root → 宿主 uid 100000），拿不到
#   宿主 root；但容器内 uid 1000 直通宿主当前用户（D1），且服务能读写宿主 ~/.ssh、
#   跑宿主终端（/ws/host-terminal）→ 等于宿主用户账号的完整权限。
#   - 永远只 listen 127.0.0.1（默认），除非你在受控网络内明确要远程访问。
#   - token 是唯一凭据，config 文件务必保持 0600。

# Web 监听。host 可设 auto（= 默认路由接口的 IPv4，绑本机网卡 IP）。
# host 为任何非 127.0.0.1 值都会触发启动警告（见 CLI 输出）。
listen:
  host: 127.0.0.1
  port: 7321

lxc:
  # 模板容器名：新建容器 = lxc-copy 克隆它。
  # ⚠️ 克隆时模板必须处于 STOPPED——lxc-copy 对运行中的源会静默失败（exit 1、无输出）。
  # 制作模板：scripts/lxc-template.sh <容器名>（见 docs/lxc-migration.md）。
  template: ms-template

# 容器 veth 挂的宿主网桥设备名（不是 docker 网络名）。必须是 /sys/class/net 下存在的桥。
# mysandbox 自有独立网桥 mysandbox0：由 /etc/systemd/system/mysandbox-net.service 建（含网关副 IP
# <ipPool 前缀>.1 与网段出网 MASQUERADE），不依赖 docker——dev-lan 重建/停 docker 都不影响容器网络。
# 与 docker 服务网段（services.network）的互通见 mysandbox-docker-interop.service（DOCKER-USER 放行）。
network: mysandbox0

# docker 服务层：配套服务（数据库等）由 mysandbox 启动并管理，挂在 dev-lan 上。
# 服务 = 单容器 + 固定 IP + 命名卷 mysandbox-svc-<名称>；不发布端口到宿主（LXC 容器按服务名直连，
# hosts 自动注入 <ip> <服务名>）。mysandbox 只管理自己创建的服务（label 标记），不碰外部容器。
services:
  enabled: true
  # docker 网络名（≠ 上面 network 的桥设备名）。LXC 在自有桥 mysandbox0 上，两网段经宿主路由互通
  # （mysandbox-docker-interop.service 放行跨桥转发；LXC → 服务 IP 由它保障，勿删）。
  # 网络自持：缺失时 mysandbox 按服务池隐含的 /24 自动创建——手工建会落到 docker 默认池
  # （10.201.x/172.x，与 LXC 网段不通），别手工建。
  network: dev-lan
  # 服务静态 IP 池（docker 动态分配从 .2 顺排，.200+ 天然隔离）。
  ipPool:
    from: 10.88.0.200
    to: 10.88.0.240
    reserved: []
  # 镜像拉取硬超时（毫秒；默认 30 分钟）。正常卡死会被 5 分钟无输出看门狗先拦下。
  pullTimeoutMs: 1800000

# 宿主 ~/.ssh 源，以只读挂到容器 /mnt/host/.ssh，供首启 seed 与批量 reseed。
sshSource: ""
# claude settings 模板路径；留空则不挂载（容器内 seed 会跳过 settings 部分）。
claudeSettingsTemplate: ""

# 自动分配的固定 IP 池（/24 前缀取前 3 段）。reserved 永不分配（如网关、已固定服务）。
ipPool:
  from: 10.88.10.20
  to: 10.88.10.250
  reserved:
    - 10.88.10.1
    - 10.88.10.2

# 新建容器的默认 git 身份（可被批量配置覆盖）。
git:
  name: dev
  email: dev@local

ui:
  defaultShell: zsh   # 网页终端默认 shell；可在 URL ?shell= 覆盖
