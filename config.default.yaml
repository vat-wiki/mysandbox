# mysandbox 默认配置（随包发布）。
# 用户覆盖：~/.config/mysandbox/config.yaml（首启自动生成，含随机 token，权限 0600）。
# 这里留空的字段（sshSource）首启按宿主用户自动填充。
#
# ⚠️ 安全：mysandbox 跑 unprivileged LXC 容器（容器 root → 宿主 uid 100000），拿不到
#   宿主 root；但容器内 uid 1000 直通宿主当前用户（D1），且服务能读写宿主 ~/.ssh、
#   跑宿主终端（/ws/host-terminal）→ 等于宿主用户账号的完整权限。
#   - 永远只 listen 127.0.0.1（默认），除非你在受控网络内明确要远程访问。
#   - token 是唯一凭据，config 文件务必保持 0600。

# Web 监听。host 可设 auto（= 默认路由接口的 IPv4，绑本机网卡 IP）。
# host 为任何非 127.0.0.1 值都会触发启动警告（见 CLI 输出）。
# tls: 自签名 HTTPS（本地 CA + *.基域名/IP 泛叶子证书，首次启用自动生成到
# ~/.local/share/mysandbox/tls/）。开启后浏览器需把 ca.crt 导入信任库一次
# （也可在 https://<域名>:<port>/tls-ca.crt 下载）；CLI/脚本用 --cacert 或 -k。
listen:
  host: 127.0.0.1
  port: 7321
  tls: false

lxc:
  # 模板容器名：新建容器 = lxc-copy 克隆它。
  # ⚠️ 克隆时模板必须处于 STOPPED——lxc-copy 对运行中的源会静默失败（exit 1、无输出）。
  # 制作模板：scripts/lxc-template.sh <容器名>（见 docs/lxc-migration.md）。
  template: ms-template

# 容器 veth 挂的宿主网桥设备名（不是 docker 网络名）。必须是 /sys/class/net 下存在的桥。
# mysandbox 自有独立网桥 mysandbox0：由 /etc/systemd/system/mysandbox-net.service 建（含网关副 IP
# <ipPool 前缀>.1 与网段出网 MASQUERADE），不依赖 docker——mysandbox-lan 重建/停 docker 都不影响容器网络。
# 与 docker 服务网段（services.network）的互通见 mysandbox-docker-interop.service（DOCKER-USER 放行）。
network: mysandbox0

# docker 服务层：配套服务（数据库等）由 mysandbox 启动并管理，挂在 mysandbox-lan 上。
# 服务 = 单容器 + 固定 IP + 命名卷 mysandbox-svc-<名称>；不发布端口到宿主（LXC 容器按服务名直连，
# hosts 自动注入 <ip> <服务名>）。mysandbox 只管理自己创建的服务（label 标记），不碰外部容器。
services:
  enabled: true
  # docker 网络名（≠ 上面 network 的桥设备名）。LXC 在自有桥 mysandbox0 上，两网段经宿主路由互通
  # （mysandbox-docker-interop.service 放行跨桥转发；LXC → 服务 IP 由它保障，勿删）。
  # 网络自持：缺失时 mysandbox 按服务池隐含的 /24 自动创建（桥设备名钉 br-mysandbox，
  # 带 managed-by label）——手工建会落到 docker 默认池（10.201.x/172.x，与 LXC 网段不通），别手工建。
  network: mysandbox-lan
  # 服务静态 IP 池（docker 动态分配从 .2 顺排，.200+ 天然隔离）。
  ipPool:
    from: 10.88.0.200
    to: 10.88.0.240
    reserved: []
  # compose up 硬顶超时（毫秒；默认 30 分钟，创建/应用/迁移共用）。正常卡死会被
  # 5 分钟无输出看门狗先拦下（见 serviceCompose.ts composeUp）。
  pullTimeoutMs: 1800000

# 宿主 ~/.ssh 源，以只读挂到容器 /mnt/host/.ssh，供首启 seed 与批量 reseed。
sshSource: ""
# claude settings 模板路径；留空则不挂载（容器内 seed 会跳过 settings 部分）。
claudeSettingsTemplate: ""

# 自动分配的固定 IP 池（/24 前缀取前 3 段）。reserved 永不分配（如网关、已固定服务）。
ipPool:
  from: 10.88.10.20
  to: 10.88.10.250
  reserved:
    - 10.88.10.1
    - 10.88.10.2

# 新建容器的默认 git 身份（可被批量配置覆盖）。
git:
  name: dev
  email: dev@local

ui:
  defaultShell: zsh   # 网页终端默认 shell；可在 URL ?shell= 覆盖

# 终端输出活动监测（tab 右键「无输出时提醒」）：服务端每 5s 扫 tmux 会话尾部输出，
# 输出安静超过 quietSeconds 秒且前端判定没人看着该 tab 时弹提醒——agent 干完活/等
# 输入场景。安静阈值过小会在人读输出时误报，一般不用调。
terminal:
  quietSeconds: 15

# 宿主防火墙（ufw）——三方互通（宿主 ↔ LXC ↔ docker 服务）的放行自管。
# 核心规则由 server/firewall.ts 按 config 推导（容器 DNS 53、非 localhost 监听时的 console
# 端口、LXC 桥 route 放行），由 mysandbox-firewall.service 开机应用（幂等、只增不删）。
# 这里只放环境特例的追加规则（默认空）。示例：
# firewall:
#   allow:
#     - from: 10.88.18.0/24   # 来源网段
#       port: 7321            # 缺省 = 全端口
#       proto: tcp            # 缺省 tcp
#       comment: hotspot -> mysandbox 7321
firewall:
  allow: []

# 宿主 docker API 桥（server/dockerApi.ts）——LXC 容器内免装 docker，直用宿主 dockerd。
# mysandbox 进程内跑一个 TCP → dockerApi.socket 的透传代理，绑网关 IP（<ipPool 前缀>.1）
# 的 2375 端口；容器侧自动配套：hosts 注入 host.docker.internal → 网关 IP（services 尾块），
# shell/exec 注入 DOCKER_HOST=tcp://host.docker.internal:2375，容器里只需 docker 客户端
# （模板脚本 step docker-cli 装静态 CLI，不带 daemon）。
# ⚠️ 安全：能调 docker API = 宿主 root 级权限（docker 可挂载宿主 /）。端口只对 LXC 网段
# 放行（firewall.ts 按 config 推导 INPUT 规则，改完 config 记得
# sudo systemctl restart mysandbox-firewall）；代理随 mysandbox 进程存活，服务停即关。
# 换 podman 时 socket 指向其兼容 socket 即可。
dockerApi:
  enabled: false
  socket: /var/run/docker.sock

# peer API（server/peer.ts）——容器间命令互通的转发枢纽：在系统容器里
# `mysandbox exec <目标> -- 命令` 可在宿主 / 其他系统容器 / 应用容器上执行命令
# （宿主代为 lxc-attach / docker exec），目标: host | c:<容器名> | s:<服务名>，
# 免 SSH。宿主 CLI 同款（mysandbox exec / targets，进程内直调不需要服务在跑）。
# 监听绑网关 IP（<ipPool 前缀>.1，LAN 无路由可达），ufw 只放 LXC 网段（firewall.ts
# 推导；改过端口记 sudo systemctl restart mysandbox-firewall）。凭据是独立
# peerToken（首启随 config 生成、0600，不是控制台主 token），宿主自动种进每个
# 受管容器的 ~/.config/mysandbox/peer.json（启动扫描/建容器时刷新）。
peer:
  enabled: true
  port: 7331

# Web 代理（server/proxy.ts）：面板外经 mysandbox 访问容器/服务的 HTTP(+WS) 端口。
# 端口点击跟随控制台访问口径：IP:端口 打开控制台 → 直连容器/服务 IP:端口；经基域名
# 打开 → 走 <name>-<port>.<基域名>:<listen.port> 代理（cookie 会话，Path 限 /proxy）。
# 远程访问的前提仍是宿主可达（LAN 或 tailscale）。
proxy:
  # vhost 基域名候选：auto = mysandbox.test（固定好记；⚠️ .local 无公共 DNS，需宿主侧
  # 应答 *.mysandbox.test——mihomo hosts/dnsmasq/路由器均可，没配也不坏：前端逐个探测
  # 候选，自动落到能解析的）→ LAN sslip（零配置兜底）→ tailscale sslip（远程设备）。
  # off = 关闭（退回同源子路径门面）。其他值 = 自有域名：泛解析 *.<域名> → 宿主 IP
  # 即可（最稳，无第三方 DNS 依赖）。
  vhost: auto
  # 钉死基 IP（多网卡/动态 IP 环境想让 sslip 域名稳定时设）；auto = 默认路由接口 IPv4。
  ip: auto
